<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<title id="pageTitle">מזג ודעה - עדכוני מזג אוויר</title>
<meta name="description" content="עדכוני מזג אוויר בזמן אמת - התרעות, תחזיות ותמונות."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<!-- ===== מסך התחברות ===== -->
<div id="loginScreen">
  <div class="sky-strip"></div>
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-cloud-sun-rain"></i></div>
    <div class="login-title" id="loginSiteTitle">מזג ודעה</div>
    <div class="login-sub">עדכוני מזג אוויר בזמן אמת</div>
    <button id="googleBtn" class="google-btn" onclick="window._doLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.69V4.98H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.02l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.98l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      <span>התחברות עם Google</span>
    </button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- ===== מסך חסימה ===== -->
<div id="bannedScreen">
  <i class="fas fa-ban"></i>
  <h1>הגישה נחסמה</h1>
  <p>החשבון שלך נחסם מגישה לאתר.<br>לא ניתן לצפות בעדכונים.</p>
  <button onclick="window._doLogout()">התנתק</button>
</div>

<!-- ===== מסך תחזוקה ===== -->
<div id="maintenanceScreen">
  <i class="fas fa-screwdriver-wrench"></i>
  <h1>האתר בתחזוקה</h1>
  <p id="maintenanceMsg">נחזור בקרוב.</p>
  <button onclick="window._doLogout()">התנתק</button>
</div>

<!-- ===== האתר עצמו ===== -->
<div id="app">
  <div class="sky-strip"></div>
  <header>
    <div class="hdr-brand">
      <i class="fas fa-cloud-sun-rain"></i>
      <div class="hdr-name">מזג ודעה</div>
    </div>
    <div class="hdr-user">
      <button id="leaderboardBtn" class="admin-gear-btn" style="display:none" onclick="window._openLeaderboard()" title="לוח מובילים">
        <i class="fas fa-trophy"></i>
      </button>
      <button id="announceBtn" class="admin-gear-btn" style="display:none;position:relative" onclick="window._openAnnouncements()" title="הודעות מנהל">
        <i class="fas fa-bullhorn"></i>
        <span id="announceBadge" class="announce-badge" style="display:none"></span>
      </button>
      <button id="adminBtn" class="admin-gear-btn" style="display:none" onclick="window._openAdmin()" title="ניהול">
        <i class="fas fa-gear"></i>
      </button>
      <span id="hdrUserName" class="hdr-user-name"></span>
      <div id="userAvatar"></div>
    </div>
  </header>

  <main id="feedWrap">
    <!-- ===== באנר פרסומת ===== -->
    <div id="adBanner" class="ad-banner" style="display:none"></div>

    <!-- ===== טופס פרסום — מוצג רק לכותבים/מנהלים ===== -->
    <div id="composer" class="composer" style="display:none">
      <textarea id="composerText" class="composer-text" rows="3" maxlength="2000" placeholder="מה מזג האוויר היום?"></textarea>
      <div class="composer-row">
        <input type="text" id="composerImg" class="composer-input" placeholder="קישור לתמונה (אופציונלי)">
        <input type="text" id="composerVideo" class="composer-input" placeholder="קישור לוידאו YouTube (אופציונלי)">
      </div>
      <div class="composer-row">
        <input type="text" id="composerTags" class="composer-input" placeholder="תגיות, מופרדות בפסיק (למשל: התרעה, סופה)">
      </div>
      <div class="composer-footer">
        <span id="composerError" class="composer-error"></span>
        <button id="composerSubmitBtn" class="composer-submit" onclick="window._submitPost()">פרסם עדכון</button>
      </div>
    </div>

    <div id="feedInner"></div>
    <div id="empty">
      <i class="fas fa-cloud"></i>
      <p>עדיין אין עדכונים</p>
    </div>
  </main>
</div>

<!-- ===== פאנל ניהול ===== -->
<div id="adminModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>ניהול האתר</h2>
      <button class="modal-close" onclick="window._closeAdmin()">✕</button>
    </div>

    <section class="admin-section">
      <h3>הרשאות כתיבה</h3>
      <div class="admin-form">
        <input type="text" id="roleEmailInput" placeholder="אימייל (אותיות קטנות)">
        <input type="text" id="roleNameInput" placeholder="שם תצוגה">
        <select id="roleSelect">
          <option value="writer">כותב</option>
          <option value="super">מנהל-על</option>
          <option value="reader">קורא בלבד</option>
        </select>
        <button onclick="window._setRole()">עדכן הרשאה</button>
      </div>
      <p id="roleMsg" class="admin-msg"></p>
    </section>

    <section class="admin-section">
      <h3>חסימת משתמשים</h3>
      <div class="admin-form">
        <input type="text" id="blockEmailInput" placeholder="אימייל לחסימה">
        <button onclick="window._blockUser()">חסום</button>
      </div>
      <div id="blockedList" class="admin-list"></div>
    </section>

    <section class="admin-section">
      <h3>מצב תחזוקה</h3>
      <label class="admin-checkbox">
        <input type="checkbox" id="updateModeToggle"> הפעל מצב תחזוקה (רק מנהל-על יראה את האתר)
      </label>
      <input type="text" id="updateModeMsg" placeholder="הודעה שתוצג לגולשים" style="margin-top:8px;width:100%">
      <button onclick="window._saveUpdateMode()" style="margin-top:8px">שמור</button>
    </section>

    <section class="admin-section">
      <h3>פרסומת</h3>
      <label class="admin-checkbox">
        <input type="checkbox" id="adToggle"> הצג פרסומת בראש הפיד
      </label>
      <div class="admin-form" style="margin-top:8px">
        <input type="text" id="adText" placeholder="טקסט הפרסומת">
        <input type="text" id="adImg" placeholder="קישור לתמונה (אופציונלי)">
        <input type="text" id="adLink" placeholder="קישור ליעד בלחיצה (אופציונלי)">
      </div>
      <button onclick="window._saveAd()" style="margin-top:8px">שמור</button>
      <p id="settingsMsg" class="admin-msg"></p>
    </section>
  </div>
</div>

<!-- ===== מודל הודעות מנהל ===== -->
<div id="announceModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>הודעות מנהל</h2>
      <button class="modal-close" onclick="window._closeAnnouncements()">✕</button>
    </div>
    <div id="announceList" class="announce-list"></div>
    <div id="announceSendRow" class="cmt-input-row" style="display:none;margin-top:12px">
      <input type="text" id="announceInput" placeholder="כתוב הודעה לכל הגולשים..." maxlength="500"
             onkeydown="if(event.key==='Enter')window._sendAnnouncement()">
      <button onclick="window._sendAnnouncement()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- ===== מודל לוח מובילים ===== -->
<div id="leaderboardModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>לוח מובילים</h2>
      <button class="modal-close" onclick="window._closeLeaderboard()">✕</button>
    </div>
    <p class="admin-msg" style="margin-bottom:10px">מבוסס על 20 העדכונים האחרונים בפיד.</p>
    <div id="leaderboardList" class="admin-list"></div>
  </div>
</div>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
